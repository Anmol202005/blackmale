services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tempmail
      POSTGRES_USER: tempmail
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tempmail-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    networks:
      - tempmail-network
    restart: unless-stopped

  # Mailcow Email Server
  mailcow:
    image: mailcow/mailcow-dockerized:latest
    hostname: mail.${DOMAIN}
    environment:
      - MAILCOW_HOSTNAME=mail.${DOMAIN}
      - MAILCOW_TZ=UTC
    ports:
      - "25:25"     # SMTP
      - "143:143"   # IMAP
      - "465:465"   # SMTPS
      - "587:587"   # SMTP Submission
      - "993:993"   # IMAPS
    volumes:
      - mailcow_data:/var/lib/docker/volumes/mailcowdockerized_vmail-vol-1/_data
    networks:
      - tempmail-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://tempmail:${DB_PASSWORD}@postgres:5432/tempmail
      - REDIS_URL=redis://redis:6379
      - MAILCOW_API_URL=http://mailcow:8080/api/v1
      - MAILCOW_API_KEY=${MAILCOW_API_KEY}
      - TEMP_EMAIL_DOMAIN=${DOMAIN}
      - EMAIL_LIFETIME_MINUTES=10
    networks:
      - tempmail-network
    depends_on:
      - postgres
      - redis
      - mailcow
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    environment:
      - VITE_API_URL=https://api.${DOMAIN}
    networks:
      - tempmail-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/ssl/certs
    networks:
      - tempmail-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  mailcow_data:

networks:
  tempmail-network:
    driver: bridge